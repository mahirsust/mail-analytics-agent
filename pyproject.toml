[project]
name = "mail-analytics-agent"
version = "0.1.0"
description = "AI agent for email automation and analytics on Microsoft 365"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Agent framework
    "semantic-kernel>=1.15.0",
    # Azure SDKs
    "azure-identity>=1.17.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-storage-queue>=12.11.0",
    "azure-search-documents>=11.6.0",
    "azure-ai-projects>=1.0.0b5",
    "azure-monitor-opentelemetry>=1.6.0",
    # MCP
    "mcp>=1.3.0",
    # Config & validation
    "pydantic-settings>=2.4.0",
    "pydantic>=2.9.0",
    # HTTP client
    "httpx>=0.27.0",
    # Auth / JWT
    "msal>=1.31.0",
    "python-jose[cryptography]>=3.3.0",
    # Observability
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # Embeddings / ML
    "openai>=1.54.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",   # TestClient
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
